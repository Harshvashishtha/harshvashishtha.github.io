<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  {%- include head.html -%}
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  {%- include header.html -%}

  <main id="main">
    {{ content }}
  </main>

  {%- include footer.html -%}

  {%- if page.needs_video_js %}
  <script defer src="{{ '/assets/js/video.js' | relative_url }}"></script>
  {%- endif %}
</body>
</html>
