# Publications. Newest first — the page groups them by year automatically.
#
# To add a paper, copy a block and edit it. Fields:
#   title    required
#   authors  list; add `me: true` to the entry that is you (it renders bold)
#            add `full:` to give Google Scholar a fuller name than the display initials
#            add `equal: true` to mark an equal-contribution author with an asterisk
#   venue    journal or preprint server, as you want it printed
#   detail   optional volume/pages, e.g. "14, 5710"
#   year     required — drives the grouping and the citation metadata
#   type     article | preprint | review   (controls the little tag)
#   status   optional short label shown as a tag, e.g. "In press", "Under review"
#   url      canonical landing page
#   doi      optional; emitted as citation_doi for Google Scholar
#   note     optional line under the entry
#   selected optional; true puts it in "Selected work" on the home page
#   links    optional extra buttons (PDF, code, data, preprint…)

